<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinly — design mockup v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #4338CA;
    --color-primary-2: #6366F1;
    --color-orange: #F2542D;
    --color-green: #16A34A;
    --color-blue: #2563EB;
    --color-amber: #B45309;
    --color-teal-dark: #0F766E;
    --color-teal-darker: #134E4A;
    --ink: #1E1B2E;
    --ink-soft: #6B6680;
    --paper: #F7F6F3;
    --border: #E7E4DE;
    --radius-pill: 999px;
    --radius-card: 20px;
    --shadow: 0 6px 16px rgba(30, 27, 46, 0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wordmark {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---- top bar (flat, no outer containers) ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 18px 32px;
    max-width: 1600px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  /* above mobile: true three-zone header so the search bar sits centered
     between the brand and nav group, with the leftover space split evenly
     on both sides, instead of growing from one side and leaving it lopsided */
  @media (min-width: 681px) {
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
    }
    .brand { justify-self: start; }
    .search { justify-self: center; width: clamp(220px, 32vw, 440px); }
    .nav-group { justify-self: end; margin-left: 0; }
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--ink);
    flex: 0 0 auto;
  }
  .brand svg { display: block; }

  .search {
    flex: 1 1 240px;
    min-width: 160px;
    max-width: 520px;
    display: flex;
    align-items: center;
    gap: 9px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 9px 16px;
    color: var(--ink-soft);
  }
  .search svg { flex-shrink: 0; }
  .search input {
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    width: 100%;
  }
  .search input::placeholder { color: var(--ink-soft); }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 28px;
    flex: 0 0 auto;
    margin-left: auto;
  }

  .nav-tabs {
    display: flex;
    gap: 26px;
    flex: 0 0 auto;
  }
  .tab {
    position: relative;
    padding: 4px 0;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 2px;
    border-radius: 2px;
    background: var(--color-primary-2);
  }

  .nav-actions { display: flex; align-items: center; flex: 0 0 auto; }

  @media (max-width: 680px) {
    .search { order: 3; flex-basis: 100%; max-width: none; }
  }
  .text-link {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .text-link:hover { color: var(--ink); }

  /* ---- boards row ---- */
  .section {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 32px;
  }
  .boards-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
    margin-top: 28px;
  }
  .board-card {
    border-radius: var(--radius-card);
    padding: 18px 20px;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    color: #fff;
    box-shadow: var(--shadow);
  }
  .board-card h3 {
    margin: 0;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .board-card .count {
    margin-top: 3px;
    font-size: 0.8rem;
    opacity: 0.85;
    font-weight: 500;
  }

  /* board card: real cover photo + a dark scrim so white text always reads,
     same skeleton-while-loading treatment as pin cards (.art, defined below) */
  .board-card.photo {
    position: relative;
    overflow: hidden;
    background: #ece7dc;
  }
  .board-card.photo .art {
    position: absolute;
    inset: 0;
  }
  .board-card.photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.62) 100%);
    z-index: 1;
    pointer-events: none;
  }
  .board-card.photo h3,
  .board-card.photo .count { position: relative; z-index: 2; }

  /* ---- masonry pin grid: card IS the image, nothing wrapped around it ---- */
  .masonry {
    column-count: 2;
    column-gap: 16px;
    margin-top: 28px;
    padding-bottom: 48px;
  }
  @media (min-width: 640px) { .masonry { column-count: 3; } }
  @media (min-width: 960px) { .masonry { column-count: 4; } }
  @media (min-width: 1300px) { .masonry { column-count: 5; } }
  @media (min-width: 1650px) { .masonry { column-count: 6; } }

  .divider {
    border: none;
    border-top: 2px solid #CBC3B2;
    margin: 32px 0 0;
  }

  .pin-card {
    display: block;
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
  }

  /* neutral skeleton shown until the real photo finishes loading */
  .art {
    position: relative;
    width: 100%;
    background: linear-gradient(100deg, #ECE9E2 30%, #E1DDD3 45%, #ECE9E2 60%);
    background-size: 200% 100%;
    animation: skeleton-sweep 1.3s ease-in-out infinite;
  }
  .art.loaded { animation: none; background: none; }
  .art img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .art img.loaded { opacity: 1; }
  @keyframes skeleton-sweep {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .art { animation: none; }
  }
  .pin-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.38), rgba(0,0,0,0) 40%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .pin-card:hover::after,
  .pin-card:focus-within::after { opacity: 1; }

  .save-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: #fff;
    color: var(--ink);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    border: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .pin-card:hover .save-btn,
  .pin-card:focus-within .save-btn { opacity: 1; transform: translateY(0); }

  .icon-btn {
    position: absolute;
    left: 10px;
    bottom: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.92);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .pin-card:hover .icon-btn,
  .pin-card:focus-within .icon-btn { opacity: 1; transform: translateY(0); }

  footer {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 32px 24px;
    border-top: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 0.82rem;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C7.58 2 4 5.58 4 10c0 3.5 2.3 6.47 5.5 7.5L11 22l1-5.1c.33.03.66.1 1 .1 4.42 0 8-3.58 8-8s-3.58-7-9-7z" fill="currentColor"/>
      </svg>
      Pinly
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input type="text" placeholder="Search pins">
    </div>
    <div class="nav-group">
      <nav class="nav-tabs">
        <a class="tab active" href="#">Feed</a>
        <a class="tab" href="#">Boards</a>
        <a class="tab" href="#">Upload</a>
        <a class="tab" href="#">Profile</a>
      </nav>
      <div class="nav-actions">
        <a class="text-link" href="#">Logout</a>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="boards-row">
      <div class="board-card photo">
        <div class="art"><img data-src="https://picsum.photos/seed/pinly-board-weekend-trips/480/320" alt=""></div>
        <h3>Weekend Trips</h3>
        <span class="count">12 pins</span>
      </div>
      <div class="board-card photo">
        <div class="art"><img data-src="https://picsum.photos/seed/pinly-board-recipes/480/320" alt=""></div>
        <h3>Recipes</h3>
        <span class="count">27 pins</span>
      </div>
      <div class="board-card photo">
        <div class="art"><img data-src="https://picsum.photos/seed/pinly-board-ui-inspiration/480/320" alt=""></div>
        <h3>UI Inspiration</h3>
        <span class="count">9 pins</span>
      </div>
      <div class="board-card photo">
        <div class="art"><img data-src="https://picsum.photos/seed/pinly-board-apartment-ideas/480/320" alt=""></div>
        <h3>Apartment Ideas</h3>
        <span class="count">5 pins</span>
      </div>
      <div class="board-card photo">
        <div class="art"><img data-src="https://picsum.photos/seed/pinly-board-diy-projects/480/320" alt=""></div>
        <h3>DIY Projects</h3>
        <span class="count">16 pins</span>
      </div>
    </div>
  </section>

  <section class="section">
    <hr class="divider">
  </section>

  <section class="section">
    <div class="masonry" id="masonry"></div>
  </section>

  <footer>Pinly — design mockup v2, not the real app.</footer>

<script>
  const heights = [220, 280, 180, 320, 240, 200, 300, 260];
  const grid = document.getElementById('masonry');
  for (let i = 0; i < 28; i++) {
    const h = heights[i % heights.length];
    const src = `https://picsum.photos/seed/pinly-pin-${i}/500/${h * 2}?cb=${Date.now()}`;
    const card = document.createElement('a');
    card.className = 'pin-card';
    card.href = '#';
    card.innerHTML = `
      <div class="art" style="height:${h}px;">
        <img alt="" loading="lazy" data-src="${src}">
      </div>
      <button class="icon-btn" aria-label="Download" title="Download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
        </svg>
      </button>
      <button class="save-btn">Save</button>`;
    grid.appendChild(card);
  }

  // Slight stagger so cards don't all pop in at once; real pins just load as
  // soon as the browser requests them, same as this, no artificial delay.
  document.querySelectorAll('.art img[data-src]').forEach((img, i) => {
    setTimeout(() => {
      img.src = img.dataset.src;
      img.addEventListener('load', () => {
        img.classList.add('loaded');
        img.closest('.art').classList.add('loaded');
      });
    }, 120 * i);
  });
</script>
</body>
</html>
